# Publishes the site to GitHub Pages (https://<user>.github.io/<repo>/), an
# address X lets people link to. One-time setup: repository Settings -> Pages
# -> Source: "GitHub Actions".
name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web_static/**"
      - "products.yaml"
      - "web.py"
      - "tools/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp==3.11.18 PyYAML==6.0.2
      - run: python tools/build_pages.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
