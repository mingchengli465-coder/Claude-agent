#
# 怎么填：
# - 把「待填」换成真实内容。还没想好的就先留着「待填」，
#   客户问到这一项时，机器人会回「我请本人来跟你确认，稍等哦」并通知你。
# - 以 # 开头的是注释（比如下面的「例如」），机器人看不到，不会当成真价格报给客户。
# - 冒号后面要有一个空格；列表项用「- 」开头；缩进用空格，不要用 Tab。
# - 改完要重新部署才会生效（见 README「客服模式」）。

店铺:
  名称: vinc的ai铺子
  # 例如：Vince 的 AI 代做小铺
  简介: 在校大学生个人接单，用 AI 提效，交付前本人逐一检查。

服务:
  - 名称: 写代码
    说明: 小工具、自动化脚本、数据处理、网页小功能、程序改错等。
    价格区间: 149
    # 例如：100–500 元，按功能复杂度报价
    交付周期: 24小时内
    # 例如：简单的 1–2 天，复杂的另议
    需要客户提供:
      - 想实现什么功能，越具体越好（最好举个例子）
      - 在什么环境运行（Windows / Mac / 网页 / 手机）
      - 已有的代码或数据文件（如果有）
      - 截止时间和预算

  - 名称: 做 PPT
    说明: 课程汇报、小组展示、毕业答辩、比赛路演、工作汇报。交付可编辑的源文件，WPS 和 Office 都能打开，可以带演讲备注。
    价格区间: 按页数；1.5元一页
    # 例如：按页数，XX 元/页
    交付周期: 两小时内
    需要客户提供:
      - 主题和用途（上课汇报 / 答辩 / 比赛……）
      - 讲稿、大纲或资料（有多少给多少）
      - 页数要求、有没有指定模板或配色
      - 截止时间和预算

  - 名称: 写文案 / 小红书文案
    说明: 小红书笔记、公众号文章、产品介绍、活动文案等。
    价格区间: 15-30
    交付周期: 待填
    需要客户提供:
      - 写什么、给谁看、发在哪个平台
      - 字数或篇数
      - 想要的风格（可以发几篇喜欢的参考）
      - 截止时间和预算

  - 名称: 做简单网站
    说明: 个人主页、作品集、活动页、小店展示页这类简单网站。
    价格区间: 69-99
    交付周期: 12小时
    需要客户提供:
      - 网站用来做什么、要几个页面
      - 文字、图片、Logo 等素材
      - 喜欢的参考网站（如果有）
      - 需不需要帮忙上线、有没有域名
      - 截止时间和预算

付款方式: 先付 50% 定金再开工，交付后付尾款；支持微信 / 支付宝
# 例如：先付 50% 定金再开工，交付后付尾款；支持微信 / 支付宝

修改次数: 交付后免费小改 3 次，大改另议
# 例如：交付后免费小改 2 次，大改另议

不接:
